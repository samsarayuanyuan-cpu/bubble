<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>池 — ASCII 思维泡泡手账</title>
<style>
  :root{
    color-scheme: light;
    --ink:#2e2e2b;
    --ink-soft:#8a8a84;
    --hair:#e2e2dc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  body{
    font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
    color:var(--ink);

  }
  canvas{position:fixed;inset:0;display:block}
  #bg{z-index:1}
  #fg{z-index:2}

  .chrome{position:fixed;z-index:5;pointer-events:none;font-size:11px;letter-spacing:.14em;color:var(--ink-soft)}
  #dateTag{top:26px;left:32px;text-align:left}
  #dateTag b{display:block;font-size:19px;letter-spacing:.06em;color:var(--ink);font-weight:500;margin-bottom:5px}
  #pageTag{top:30px;right:32px}

  .margin-line{position:fixed;top:0;bottom:0;left:76px;width:1px;background:var(--hair);z-index:4;opacity:.6}
  .corner{position:fixed;width:13px;height:13px;border:1px solid var(--hair);z-index:4}
  .c-tl{top:18px;left:18px;border-right:0;border-bottom:0}
  .c-tr{top:18px;right:18px;border-left:0;border-bottom:0}
  .c-bl{bottom:18px;left:18px;border-right:0;border-top:0}

  #nav{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:6;
       display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ink-soft);letter-spacing:.12em}
  #nav button{all:unset;cursor:pointer;padding:4px 9px;border:1px solid var(--hair);border-radius:2px;
       font-family:inherit;font-size:11px;color:var(--ink-soft);transition:.18s}
  #nav button:hover{color:var(--ink);border-color:var(--ink-soft)}

  #plus{position:fixed;right:30px;bottom:30px;z-index:7;width:38px;height:38px;cursor:pointer;

  #login .row{margin-top:12px;display:flex;justify-content:space-between;align-items:center}
  #login .row span{font-size:10px;color:#b6b6b0;letter-spacing:.08em}
  #login button{all:unset;cursor:pointer;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);
    border:1px solid var(--hair);border-radius:2px;padding:4px 11px;font-family:inherit}
  #login button:hover{color:var(--ink);border-color:var(--ink-soft)}

  /* 角标热区 */

    letter-spacing:.1em;color:#c4c4be;pointer-events:none}

<script type="module">
/* ============================================================
   池 — ASCII 思维泡泡手账
   ============================================================ */

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://simwmfxctvwzwvpjsggk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fU8mJ8ULDO7_UAcTg_TL_A_JsChciux';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const TAU = Math.PI*2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=smooth(xf), v=smooth(yf);
  return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),
              lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u), v);
}
function fbm(x,y){
  return vnoise(x,y)*0.55 + vnoise(x*2.1+5.2,y*2.1+1.3)*0.30 + vnoise(x*4.3+9.1,y*4.3+7.7)*0.15;
}
function todayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* ---------- 极浅色系 ---------- */
/* 高明度 + 中等饱和 = 淡粉/淡红/淡蓝/淡黄，而不是灰 */
/* 高明度、低饱和 */
const PAL = {
  pink : [346, 26],   // 淡粉
  red  : [  6, 24],   // 淡红
  blue : [203, 24],   // 淡蓝
  gold : [ 44, 32],   // 淡黄
  plum : [318, 20],   // 淡藕荷
  leaf : [128, 15],   // 淡青绿（荷叶，仅作背景）
  vein : [165, 22],   // 叶脉：同族偏青，只靠色相差一点点来显形
};
function col(key, dens){
  const [h,s]=PAL[key];
  return `hsl(${h} ${s}% ${lerp(88, 58, clamp(dens,0,1))}%)`;
}

/* 字符坡道：以点和细字符为主 */
const RAMP = " ..:;=+*#";
const rampChar = d => RAMP[clamp(Math.floor(d*(RAMP.length-1)+0.5),0,RAMP.length-1)];

/* ============================================================
   背景场景
   ============================================================ */
const CW=6.4, CH=9.6;
let bg=document.getElementById('bg'), bgx=bg.getContext('2d');
let fg=document.getElementById('fg'), fgx=fg.getContext('2d');
let W=0,H=0,COLS=0,ROWS=0,DPR=1,ASP=1;

/* 侧视荷花的花瓣表：从后层到前层排列，后画的覆盖先画的 */
function buildPetals(r, R){
  const P=[];
  // [数量, 角度低, 角度高(弧度,0=正上), 长度, 宽度, 下垂, 内扣, 浓度]
  const tiers=[
    [4, 1.50, 2.30, 1.00, 0.20, 0.45, 0.00, 0.50],  // 外层：平展并下垂
    [3, 0.78, 1.38, 0.78, 0.19, 0.22, 0.10, 0.72],  // 中层：斜向上
    [3, 0.12, 0.66, 0.54, 0.17, 0.03, 0.40, 1.00],  // 内层：近直立、向内鼓起收拢
  ];
  for(const [cnt,lo,hi,fl,fw,droop,cup,shade] of tiers){
    const half=Math.ceil(cnt/2);
    for(let i=0;i<cnt;i++){
      const side=(i%2)?1:-1, j=(i/2)|0;
      const f=half>1 ? j/(half-1) : 0.5;
      P.push({
        a: side*lerp(lo,hi,f)*(0.90+r()*0.20),
        L: R*fl*(0.86+r()*0.28),
        W: R*fw*(0.85+r()*0.30),
        droop, cup, shade,
        swayK: 0.4+r()*0.9
      });
    }
  }
  return P;
}

function buildScene(seed){
  const r=mulberry32(seed*2654435761%2147483647);
  const S={lotus:[],pads:[],fish:[]};

  // 荷叶分象限撒点，避免挤在一角
  const nPads=3+Math.floor(r()*2);          // 3–4 片荷叶
  const cells=[[.10,.12],[.52,.12],[.10,.52],[.52,.52]];
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
  for(let i=0;i<nPads;i++){
    const [bx,by]=cells[i%cells.length];
    S.pads.push({
      x:bx+r()*.36, y:by+r()*.34, R:.085+r()*.075,
      notch:r()*TAU, ph:r()*TAU
    });
  }

  // 荷花紧挨着荷叶生长
  const nLotus=2;                           // 少而大，才看得出是花
  for(let i=0;i<nLotus;i++){
    const host=S.pads[i%S.pads.length];     // 每朵挨着一片荷叶开
    const a=r()*TAU, dist=host.R*(0.5+r()*0.4);
    const R=.135+r()*.055;                  // 放大：直径要够 40 个字符格才画得出花瓣
    S.lotus.push({
      x: clamp(host.x+Math.cos(a)*dist/Math.max(ASP,.001), .09, .91),
      y: clamp(host.y+Math.sin(a)*dist*0.75, .12, .84),
      R, ph: r()*TAU,
      petals: buildPetals(r, R),
      key: r()<.55 ? 'pink' : (r()<.5?'red':'plum')
    });
  }

  const nFish=5+Math.floor(r()*3);          // 5–7 条鱼
  for(let i=0;i<nFish;i++) S.fish.push({
    x:.08+r()*.84, y:.12+r()*.76, L:.055+r()*.070,
    rot:(r()-.5)*1.4 + (r()<.5?0:Math.PI),
    key: r()<.55?'blue':(r()<.5?'gold':'pink'),
    ph:r()*TAU, sp:.5+r()*.8, fork:.3+r()*.45
  });
  return S;
}

/* --- 荷花：逐瓣绘制，两轮错开，瓣尖收尖，无描边 --- */
function petalD(px,py,Lp,Wp){
  // px 沿花瓣轴（0=基部，Lp=尖端），py 横向
  if(px<0||px>Lp) return 0;
  const s=px/Lp;
  // 宽度包络：基部窄 → 中段最宽 → 尖端收成一个点
  const w = Wp*Math.pow(Math.sin(Math.PI*Math.pow(s,0.78)),0.9)*Math.pow(1-s,0.30);
  if(w<=1e-6) return 0;
  const q=Math.abs(py)/w;
  if(q>1) return 0;
  // 瓣缘淡到接近 0，相邻花瓣之间才留得住白
  // 纵向：基部最淡 → 瓣尖最浓（胭脂粉染在尖上）
  let v = (1-Math.pow(q,1.5)) * (0.26+0.74*Math.pow(s,0.85));
  if(q<0.15) v*=1.18;                        // 中轴一道脉
  return v;
}
let lotusTint='pink';
function dLotus(o,x,y,t){
  const dx=(x-o.x)*ASP, dy=y-o.y;
  const RR=o.R*1.55;
  if(dx*dx+dy*dy > RR*RR) return 0;          // bbox 早退
  const sway=0.055*Math.sin(t*.22+o.ph);
  let v=0;
  for(const p of o.petals){                  // 已按后→前排序
    const a=p.a+sway*p.swayK;
    // 瓣轴单位向量：a=0 指正上（屏幕 y 向下，故取 -cos）
    const ux=Math.sin(a), uy=-Math.cos(a);
    const px=dx*ux+dy*uy;
    if(px<0||px>p.L) continue;
    const k=(px/p.L)*(px/p.L);               // 弯曲随离基部距离平方增长
    // 在世界坐标里施加两种形变，再投到瓣的横向
    const bx=dx + p.cup*p.L*k*(ux>=0?-1:1);  // 内扣：朝中轴收
    const by=dy + p.droop*p.L*k;             // 下垂：朝屏幕下方
    const py=-bx*uy + by*ux;
    const vv=petalD(px,py,p.L,p.W)*p.shade;
    if(vv>0.04) v=vv;                        // 前层覆盖后层，形成层次
  }
  lotusTint=o.key;
  // 花蕊：严格限制在花心小圆内，且只有真正压过花瓣时才染黄
  // 用低频平滑噪声（而非高频 hash）取点，否则背景扰动会让它比花瓣抖得快
  const sx=dx, sy=dy+o.R*0.08;
  const sr=o.R*0.155;
  const sd2=sx*sx+sy*sy;
  if(sd2 < sr*sr){
    const sd=Math.sqrt(sd2)/sr;
    const grain=vnoise(sx/o.R*9+41.3, sy/o.R*9+17.9);
    const sv=(0.46+0.46*(1-sd))*(0.62+0.38*grain);
    if(sv>v){ v=sv; lotusTint='gold' }       // 只在胜出时才是花蕊
  }
  return v;
}

/* --- 荷叶：淡背景，无描边 --- */
let padVein=0;
function dPad(o,x,y,t){
  const dx=(x-o.x)*ASP, dy=(y-o.y)*1.06;
  const d=Math.hypot(dx,dy); if(d>o.R) return 0;
  const a=Math.atan2(dy,dx);
  const da=Math.abs(((a-o.notch+Math.PI)%TAU+TAU)%TAU-Math.PI);
  if(da < 0.26*(0.55+0.45*d/o.R)) return 0;  // 缺口自圆心向外张开
  const k=d/o.R;
  // 叶面内部的缓慢起伏（像水面托着叶片轻轻晃）
  const ripple=vnoise(dx/o.R*2.6+t*0.11+o.ph, dy/o.R*2.6-t*0.08);
  let v=0.13+0.09*(1-k)+0.07*ripple;
  // 叶脉：放射状，靠颜色而非密度体现
  const vein=Math.pow(Math.abs(Math.sin(a*8+0.25*Math.sin(t*.18+o.ph))),14);
  padVein=vein*(1-k*0.35);
  if(padVein>0.22) v+=0.05*padVein;
  return v;
}

/* --- 鱼：点阵填充，分叉弯尾 --- */
function dFish(o,x,y,t){
  const cx=o.x+0.012*Math.sin(t*.18*o.sp+o.ph);
  const cy=o.y+0.008*Math.cos(t*.22*o.sp+o.ph);
  let px=(x-cx)*ASP, py=y-cy;
  const ca=Math.cos(-o.rot), sa=Math.sin(-o.rot);
  let lx=px*ca-py*sa, ly=px*sa+py*ca;
  const a=o.L*0.5, b=o.L*0.21;
  const swing=Math.sin(lx/o.L*3.0 - t*1.1*o.sp + o.ph);
  ly += 0.06*o.L*swing;

  const e=(lx/a)*(lx/a)+(ly/b)*(ly/b);
  if(e<=1){
    const q=Math.sqrt(e);
    let v=0.52+0.44*(1-q);                                   // 中间稍密，向轮廓淡开
    v*=0.66+0.34*Math.abs(Math.sin(lx*150)*Math.sin(ly*165)); // 鳞
    if(Math.abs(ly)<b*0.08) v=Math.max(v,0.52);              // 侧线
    const ex=lx-a*0.62, ey=ly+b*0.20;
    if(ex*ex+ey*ey < Math.pow(o.L*0.032,2)) v=0.95;          // 眼
    return v;
  }
  // 尾鳍：分叉，上下两叶厚薄不一、边缘带弧度
  const tl=o.L*0.34;
  if(lx<-a && lx>-a-tl){
    const k=(-(lx+a))/tl;                                    // 0 根部 → 1 末端
    const sweep = 0.22*o.L*swing*k;                          // 随摆尾甩动
    const yy = ly - sweep;
    const spread = o.L*0.30*(0.18+0.82*Math.pow(k,0.62));    // 外缘：先快后缓
    const notch  = o.L*0.30*o.fork*Math.pow(k,1.7);          // 内缘：分叉口
    const ay=Math.abs(yy);
    if(ay<spread && ay>notch){
      const u=(ay-notch)/Math.max(spread-notch,1e-6);        // 叶内横向位置
      let v=0.40+0.42*Math.sin(Math.PI*clamp(u,0,1));        // 叶中略密，两缘淡
      v*=yy<0?1.0:0.86;                                      // 上下叶厚薄不同
      return v*(1.05-0.3*k);
    }
    return 0;
  }
  // 背鳍 / 臀鳍
  const fh=b*1.8;
  if(lx>-a*.5 && lx<a*.40){
    const lim=fh*(1-Math.abs(lx)/(a*.5))*0.95;
    if(ly<0 && ly>-lim) return 0.42*(1-Math.abs(ly)/Math.max(lim,1e-6))+0.14;
  }
  if(lx>-a*.35 && lx<a*.1){
    const lim=b*1.0*(1-Math.abs(lx)/(a*.35))*0.95;
    if(ly>0 && ly<lim) return 0.36*(1-ly/Math.max(lim,1e-6))+0.12;
  }
  return 0;
}

let scene=null, sceneSeed=-1;
function drawBG(t){
  bgx.clearRect(0,0,W,H);
  bgx.font=`10px ${getComputedStyle(document.body).fontFamily}`;
  bgx.textBaseline='top';
  const buckets=new Map();
  for(let r=0;r<ROWS;r++){
    const y0=r/ROWS;
    for(let c=0;c<COLS;c++){
      const x0=c/COLS;
      const wx=x0+0.016*Math.sin(y0*7.1+t*0.21)+0.009*Math.sin(y0*13.3-t*0.13);
      const wy=y0+0.013*Math.sin(x0*6.3-t*0.17)+0.007*Math.cos(x0*11.7+t*0.11);
      let best=0,key='leaf';
      for(const o of scene.pads ){const v=dPad(o,wx,wy,t); if(v>best){best=v;key=padVein>0.22?'vein':'leaf'}}
      for(const o of scene.lotus){const v=dLotus(o,wx,wy,t); if(v>best){best=v;key=lotusTint}}
      for(const o of scene.fish ){const v=dFish (o,wx,wy,t); if(v>best){best=v;key=o.key}}
      if(best<=0.04) continue;
      // 留白：低频噪声掏空大块区域，形成断续的点阵团块
      const m=fbm(wx*11+t*0.05, wy*11-t*0.04);
      let d=best*(0.62+0.66*m);
      if(d<0.12) continue;
      d*=0.90+0.18*hash2(c*0.37,r*0.71);
      const ch=rampChar(d);
      if(ch===' ') continue;
      const cl=col(key,d);
      let arr=buckets.get(cl); if(!arr){arr=[];buckets.set(cl,arr)}
      arr.push(ch,c*CW,r*CH);
    }
  }
  for(const [cl,arr] of buckets){
    bgx.fillStyle=cl;
    for(let i=0;i<arr.length;i+=3) bgx.fillText(arr[i],arr[i+1],arr[i+2]);
  }
}

/* ============================================================
   泡泡
   ============================================================ */
const BUB_FONT=13, BUB_LH=19, BUB_CHW=7.8;
const MAX_CHARS=24, MAX_PER_PAGE=11;
const WOB=0.085+0.055+0.035;         // 轮廓最大内缩比例
const SAFE=1/(1-WOB);                // 反推：保证最瘦处仍能框住文字

const cjk=c=>!/[\x00-\xff]/.test(c);
const wcw=s=>[...s].reduce((n,c)=>n+(cjk(c)?2:1),0);
function wrap(text){
  const lines=[]; let cur='';
  for(const ch of text.replace(/\s+/g,' ').trim()){
    if(wcw(cur)+(cjk(ch)?2:1)>MAX_CHARS){lines.push(cur);cur=ch} else cur+=ch;
  }
  if(cur) lines.push(cur);
  return lines.slice(0,6);
}
function measure(lines){
  const cols=Math.max(...lines.map(wcw));
  const textW=cols*BUB_CHW/2;
  const textH=lines.length*BUB_LH;
  // 文字外接矩形 → 椭圆需 √2 倍，再乘 SAFE 抵消轮廓抖动
  return {
    w: (textW*Math.SQRT2 + 30)*SAFE,
    h: (textH*Math.SQRT2 + 24)*SAFE
  };
}

function drawBubble(b,t){
  const cx=b.x, cy=b.y, rx=b.w/2, ry=b.h/2;
  const per=Math.PI*(3*(rx+ry)-Math.sqrt((3*rx+ry)*(rx+3*ry)));
  const N=Math.max(70,Math.round(per/3.2));
  const hue=b.hue!==undefined?b.hue:PAL.blue[0];
  fgx.font=`11px ${getComputedStyle(document.body).fontFamily}`;
  fgx.textBaseline='middle'; fgx.textAlign='center';
  for(let i=0;i<N;i++){
    const a=i/N*TAU;
    const rf=1+0.085*Math.sin(3*a+b.ph+t*0.33)
             +0.055*Math.sin(5*a-b.ph*1.7-t*0.21)
             +0.035*Math.sin(8*a+t*0.15);
    const gate=0.5+0.5*Math.sin(a*3-t*0.42+b.ph)*Math.cos(a*5+t*0.23-b.ph*0.6);
    if(hash2(i*0.531,b.ph*7.3) > 0.28+0.72*gate) continue;
    const jit=(hash2(i*1.77,b.ph*3.1)-0.5)*3.2;
    fgx.fillStyle=`hsl(${hue} 24% ${lerp(86,60,gate)}%)`;
    fgx.fillText('.', cx+(rx*rf+jit)*Math.cos(a), cy+(ry*rf+jit)*Math.sin(a));
  }
  fgx.font=`${BUB_FONT}px ${getComputedStyle(document.body).fontFamily}`;
  fgx.fillStyle='#2e2e2b';
  const y0=cy-(b.lines.length-1)*BUB_LH/2;
  b.lines.forEach((l,i)=>fgx.fillText(l,cx,y0+i*BUB_LH));
  fgx.font=`9px ${getComputedStyle(document.body).fontFamily}`;
  fgx.fillStyle='#c2c2bc';
  fgx.fillText(b.time,cx,cy+ry*0.70);
}

function drawFG(t){
  fgx.clearRect(0,0,W,H);
  const pg=pages[cur]; if(!pg) return;
  const B=pg.bubbles;
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){
    const a=B[i],b=B[j];
    const mx=(a.w+b.w)/2+14, my=(a.h+b.h)/2+14;
    const dx=b.x-a.x, dy=b.y-a.y;
    const ox=mx-Math.abs(dx), oy=my-Math.abs(dy);
    if(ox>0&&oy>0){
      if(ox/mx<oy/my){const s=Math.sign(dx)||1,p=ox*0.012*s;a.x-=p;b.x+=p}
      else           {const s=Math.sign(dy)||1,p=oy*0.012*s;a.y-=p;b.y+=p}
    }
  }
  for(const b of B){
    b.x+=b.vx; b.y+=b.vy;
    const mx=b.w/2+24, my=b.h/2+34;
    if(b.x<mx+70){b.x=mx+70;b.vx=Math.abs(b.vx)}
    if(b.x>W-mx){b.x=W-mx;b.vx=-Math.abs(b.vx)}
    if(b.y<my+56){b.y=my+56;b.vy=Math.abs(b.vy)}
    if(b.y>H-my-56){b.y=H-my-56;b.vy=-Math.abs(b.vy)}
    drawBubble(b,t);
  }
}

/* ============================================================
   页面 / 数据
   ============================================================ */
let pages=[], cur=0, isEditor=false;

/* 把一行数据库记录变成一个可渲染的泡泡 */
function hydrate(row){
  const lines=wrap(row.text), m=measure(lines);
  const r=mulberry32(hashStr(row.id));          // 位置由 id 决定 → 人人看到的布局一致
  const ang=r()*TAU, sp=0.055+r()*0.045;
  return {
    id:row.id, text:row.text, lines, w:m.w, h:m.h,
    x: 90+m.w/2+r()*Math.max(1,(W-180-m.w)),
    y: 120+m.h/2+r()*Math.max(1,(H-260-m.h)),
    vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
    ph:r()*TAU,
    hue: row.hue ?? PAL.blue[0],
    time: new Date(row.created_at).toTimeString().slice(0,5)
  };
}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function emptyPage(date,page,seed){return {date,page,seed,bubbles:[]}}

/* 从 Supabase 拉全部内容并重建分页 */
async function load(){
  status('读取中…');
  const [{data:rows,error:e1},{data:pgs,error:e2}] = await Promise.all([
    sb.from('bubbles').select('*').order('created_at',{ascending:true}),
    sb.from('pages').select('*')
  ]);
  if(e1||e2){ status('连接失败：'+((e1||e2).message)); pages=[emptyPage(todayKey(),0,1)]; cur=0; return }

  const seedOf=new Map((pgs||[]).map(p=>[p.day+'#'+p.page, Number(p.seed)]));
  const map=new Map();
  for(const row of (rows||[])){
    const k=row.day+'#'+row.page;
    if(!map.has(k)) map.set(k, emptyPage(row.day, row.page, seedOf.get(k) ?? hashStr(k)));
    map.get(k).bubbles.push(hydrate(row));
  }
  // 补上还没有泡泡的空页
  for(const p of (pgs||[])){
    const k=p.day+'#'+p.page;
    if(!map.has(k)) map.set(k, emptyPage(p.day,p.page,Number(p.seed)));
  }
  if(!map.size) map.set(todayKey()+'#0', emptyPage(todayKey(),0,hashStr(todayKey()+'#0')));

  pages=[...map.values()].sort((a,b)=> a.date===b.date ? a.page-b.page : (a.date<b.date?-1:1));
  cur=pages.length-1;
  status('');
}

/* 写入（仅登录后可用） */
async function addBubble(text){
  text=text.trim(); if(!text) return;
  if(text.length>300) text=text.slice(0,300);
  const tk=todayKey();

  // 决定落在哪一页
  let pg=pages[pages.length-1];
  let page = 0;
  if(pg && pg.date===tk){
    page = (pg.bubbles.length>=MAX_PER_PAGE) ? pg.page+1 : pg.page;
  }
  const isNew = !pg || pg.date!==tk || page!==pg.page;
  if(isNew){
    const seed=Math.floor(Math.random()*2147483647);
    const {error}=await sb.from('pages').insert({day:tk,page,seed});
    if(error && error.code!=='23505'){ status('写入失败：'+error.message); return }
    pages.push(emptyPage(tk,page,seed));
    cur=pages.length-1;
  }

  const hue=[PAL.blue[0],PAL.pink[0],PAL.plum[0],PAL.gold[0]][Math.floor(Math.random()*4)];
  const {error}=await sb.from('bubbles').insert({text,day:tk,page,hue});
  if(error){ status('写入失败：'+error.message); setTimeout(()=>status(''),4000); return }
  // 不在这里插入本地副本：等 realtime 回推，避免重复
}

/* 实时：别人开着页面时，你一提交他那边就出现 */
function subscribe(){
  sb.channel('bubbles-live')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'bubbles'}, async ({new:row})=>{
      const k=row.day+'#'+row.page;
      let pg=pages.find(p=>p.date===row.day && p.page===row.page);
      if(!pg){
        const {data}=await sb.from('pages').select('seed').eq('day',row.day).eq('page',row.page).maybeSingle();
        pg=emptyPage(row.day,row.page, data? Number(data.seed) : hashStr(k));
        pages.push(pg);
        pages.sort((a,b)=> a.date===b.date ? a.page-b.page : (a.date<b.date?-1:1));
      }
      if(pg.bubbles.some(b=>b.id===row.id)) return;
      pg.bubbles.push(hydrate(row));
      if(pages.indexOf(pg)===pages.length-1) cur=pages.length-1;
      syncChrome();
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'bubbles'}, ({old:row})=>{
      for(const p of pages){
        const i=p.bubbles.findIndex(b=>b.id===row.id);
        if(i>=0){p.bubbles.splice(i,1);break}
      }
      syncChrome();
    })
    .subscribe();
}

function status(s){document.getElementById('status').textContent=s||''}

const WD=['周日','周一','周二','周三','周四','周五','周六'];
function syncChrome(){
  const pg=pages[cur]; if(!pg) return;
  const [y,m,d]=pg.date.split('-');
  const wd=WD[new Date(+y,+m-1,+d).getDay()];
  const same=pages.filter(p=>p.date===pg.date), idx=same.indexOf(pg)+1;
  if(pg.seed!==sceneSeed){sceneSeed=pg.seed;scene=buildScene(pg.seed)}
  document.getElementById('dateTag').innerHTML=
    `<b>${y}.${m}.${d}</b><span>${wd} · 池 ${String(idx).padStart(2,'0')}${same.length>1?' / '+same.length:''}</span>`;
  document.getElementById('pageTag').textContent=`— ${cur+1} / ${pages.length} —`;
  document.getElementById('navLabel').textContent=pg.date===todayKey()?'今天':`${+m}月${+d}日`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===pages.length-1;
}
function go(n){cur=clamp(cur+n,0,pages.length-1);syncChrome()}

/* ---------- 交互 ---------- */
const plus=document.getElementById('plus'),comp=document.getElementById('composer'),ta=document.getElementById('ta');
function toggle(on){
  const o=on===undefined?!comp.classList.contains('on'):on;
  comp.classList.toggle('on',o); plus.classList.toggle('on',o);
  if(o){ta.value='';ta.focus()}
}
plus.onclick=()=>toggle();
ta.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const v=ta.value; ta.value=''; toggle(false);
    addBubble(v);
  }
  if(e.key==='Escape') toggle(false);
});

/* ---------- 隐藏登录 ---------- */
const loginBox=document.getElementById('login');
function showLogin(on){
  loginBox.classList.toggle('on',on);
  if(on) document.getElementById('email').focus();
}
// 入口一：左下角角标点三次
let taps=[], bl=document.querySelector('.c-bl');
bl.style.pointerEvents='auto';
bl.addEventListener('click',()=>{
  const now=Date.now(); taps=taps.filter(t=>now-t<1200); taps.push(now);
  if(taps.length>=3){taps=[];showLogin(true)}
});
// 入口二：shift+L
addEventListener('keydown',e=>{
  if(e.shiftKey && (e.key==='L'||e.key==='l') && document.activeElement===document.body) showLogin(true);
  if(e.key==='Escape') showLogin(false);
});
document.getElementById('loginBtn').onclick=doLogin;
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
async function doLogin(){
  const msg=document.getElementById('loginMsg');
  msg.textContent='…';
  const {error}=await sb.auth.signInWithPassword({
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('pass').value
  });
  if(error){ msg.textContent='不对'; return }
  msg.textContent=''; showLogin(false);
  document.getElementById('pass').value='';
}
sb.auth.onAuthStateChange((_e,session)=>{
  isEditor=!!session;
  document.body.classList.toggle('editor',isEditor);
});
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
addEventListener('keydown',e=>{
  if(document.activeElement===ta) return;
  if(e.key==='ArrowLeft')go(-1);
  if(e.key==='ArrowRight')go(1);
  if(e.key==='n'||e.key==='N')toggle(true);
});

/* ---------- 循环 ---------- */
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;ASP=W/H;
  COLS=Math.ceil(W/CW);ROWS=Math.ceil(H/CH);
  for(const cv of [bg,fg]){
    cv.width=W*DPR;cv.height=H*DPR;
    cv.style.width=W+'px';cv.style.height=H+'px';
    cv.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
  }
}
addEventListener('resize',()=>{
  resize();
  // 视口变了，泡泡位置按新尺寸重算一次，避免跑到屏幕外
  for(const p of pages) for(const b of p.bubbles){
    b.x=clamp(b.x, b.w/2+94, Math.max(b.w/2+94, W-b.w/2-24));
    b.y=clamp(b.y, b.h/2+90, Math.max(b.h/2+90, H-b.h/2-90));
  }
});

resize();
scene=buildScene(1);                 // 先给个临时场景，等数据到了再换
syncChrome();

let bgLast=0;
function loop(ms){
  const t=ms/1000;
  if(ms-bgLast>55){drawBG(t);bgLast=ms}
  drawFG(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 启动 ---------- */
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  isEditor=!!session;
  document.body.classList.toggle('editor',isEditor);
  await load();
  syncChrome();
  subscribe();
})();
</script>
